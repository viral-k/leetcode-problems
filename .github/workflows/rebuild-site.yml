# yral.dev/leetcode is built from this repo at deploy time. This asks Cloudflare
# Pages to rebuild the site whenever a problem changes, so a new solution shows
# up there without touching the site repo.
#
# Needs one repository secret, CF_DEPLOY_HOOK_URL: the deploy hook URL from
# Cloudflare dashboard > Workers & Pages > yral-dev > Settings > Builds >
# Deploy hooks. Without it the job skips instead of failing.
name: Rebuild yral.dev

on:
  push:
    branches: [main]
    paths: ["easy/**", "medium/**", "hard/**"]
  workflow_dispatch:

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CF_DEPLOY_HOOK_URL is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
